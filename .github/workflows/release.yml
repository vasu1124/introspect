name: Release-Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release-please
        with:
          token: ${{ secrets.INTROSPECT_RELEASE_PLEASE }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
