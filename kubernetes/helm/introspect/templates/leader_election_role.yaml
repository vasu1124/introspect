# permissions to do leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "introspect.fullname" . }}-lease
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# allow introspect to read its own pod manifest (probe timings for /healthz/ui)
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get

